de.muenchen.isi:
  cronjob:
    shedlock: 1m
    S3.cleanup:
      # CronExpression: https://docs.spring.io/spring-framework/docs/current/reference/html/integration.html#scheduling-cron-expression
      orphan-files: "0 0/2 * * * *"

refarch.s3:
  file-expiration-time: 1 # 1 minute
  initial-connection-test: false
  bucket-name: dummy-bucket
  access-key: dummy-access-key
  secret-key: dummy-secret-key
  url: https://dummy-url.muenchen.de